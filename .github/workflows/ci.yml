# Step 8 (stretch): lint + test on every push.
# This is intentionally minimal to start — extend it once Steps 1-6 work
# locally. Don't add Docker build/deploy steps until the API actually works.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check src/ tests/

      - name: Run tests
        run: pytest tests/
