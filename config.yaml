data:
  train_path: "data/train.csv"
  target_column: "Churn"
  test_size: 0.2
  random_state: 42

model:
  type: "xgboost"   # options: logistic_regression, xgboost
  logistic_regression:
    max_iter: 1000
    C: 1.0
  xgboost:
    n_estimators: 100
    max_depth: 4
    learning_rate: 0.1
    random_state: 42
    scale_pos_weight: 2.77

mlflow:
  experiment_name: "churn-prediction"
  tracking_uri: "sqlite:///mlflow.db"

registry:
  model_name: "churn-classifier"