# Central config read by src/train.py — change values here, not in code.

data:
  train_path: "data/train.csv"
  target_column: "Churn"
  test_size: 0.2
  random_state: 42

model:
  type: "logistic_regression"   # options (as you build them out): logistic_regression, xgboost
  params:
    max_iter: 1000
    C: 1.0

mlflow:
  experiment_name: "churn-prediction"
  tracking_uri: "sqlite:///mlflow.db"  # local folder; change to a server URI later if needed

registry:
  model_name: "churn-classifier"
